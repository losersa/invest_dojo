# ═══════════════════════════════════════════════════════════════════
# InvestDojo · 基础设施（单一编排文件）
# ═══════════════════════════════════════════════════════════════════
#
# 这是 InvestDojo 基础设施的【唯一】docker compose 文件，
# 一条 `docker compose up -d` 即可拉起全部容器：
#
#   数据库与缓存
#     - postgres   :5432  主库（Python 微服务 + 自建鉴权 data-svc 直连）
#     - redis      :6379  缓存 / Pub-Sub / Celery broker
#     - minio      :9000  对象存储（模型/报告/Notebook）
#     - minio-init 一次性  自动创建 bucket
#
# 鉴权说明：
#   已【移除】 Supabase 三件套（PostgREST / GoTrue / Kong）。
#   鉴权改为自建轻量模块（common/auth.py + data-svc /api/v1/auth），
#   用户表为 public.users，会话用 httpOnly Cookie(id_session) 中的 JWT。
#   Python 微服务直连 postgres:5432，不经过任何 Supabase 组件。
#
# 启动：
#   Windows PowerShell：.\scripts\up.ps1
#   Mac / Linux bash：   ./scripts/up.sh
#   （脚本会先就绪 .env、注入密码，再 `docker compose up -d`）
#
# 数据目录：
#   ./data/db        Postgres 数据（宿主机持久化，不进 git）
#   ./data/db-backup pg_dump 备份落点
#   ../redis-data    Redis 持久化
#   ../minio-data    MinIO 数据
#
# ═══════════════════════════════════════════════════════════════════

name: investdojo-infra

services:

  # ─────────────────────────────────────────────────────────────────
  # Postgres 主库
  # ─────────────────────────────────────────────────────────────────
  db:
    image: postgres:15.8-alpine
    container_name: investdojo-db
    restart: unless-stopped
    ports:
      - "0.0.0.0:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must-be-set}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: Asia/Shanghai
    volumes:
      - ${DATA_DIR:-./data}/db:/var/lib/postgresql/data
      - ${DATA_DIR:-./data}/db-backup:/backup
      # 初始化 SQL：建扩展、schema、角色等（不再建 Supabase auth/storage）
      - ./init:/docker-entrypoint-initdb.d:ro
      # 自定义配置
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    shm_size: 256mb


  # ─────────────────────────────────────────────────────────────────
  # Redis — 缓存 + Pub/Sub + Celery broker
  # ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: investdojo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ../redis-data:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - "${REDIS_PASSWORD}"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3


  # ─────────────────────────────────────────────────────────────────
  # MinIO — 对象存储（模型文件/报告/Notebook）
  # ─────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: investdojo-minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - ../minio-data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-investdojo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-investdojo_dev_only}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────────────────────────────
  # MinIO 初始化 — 自动创建 bucket
  # ─────────────────────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: investdojo-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-investdojo} ${MINIO_ROOT_PASSWORD:-investdojo_dev_only};
      /usr/bin/mc mb --ignore-existing local/investdojo;
      /usr/bin/mc mb --ignore-existing local/investdojo/models;
      /usr/bin/mc mb --ignore-existing local/investdojo/backtests;
      /usr/bin/mc mb --ignore-existing local/investdojo/notebooks;
      /usr/bin/mc mb --ignore-existing local/investdojo/exports;
      /usr/bin/mc mb --ignore-existing local/investdojo/klines_archive;
      /usr/bin/mc anonymous set download local/investdojo/scenarios 2>/dev/null || true;
      echo '✅ MinIO buckets 初始化完成';
      exit 0;
      "
    restart: "no"


networks:
  default:
    name: investdojo-infra
    driver: bridge
